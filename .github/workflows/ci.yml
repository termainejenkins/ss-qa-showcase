name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 06:17 UTC every day
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test
        env:
          CI: "true"
          SITE_URL: https://sentientsolutions-site.pages.dev

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

  # Publishes the HTML report. Does not run on pull requests.
  # If GitHub Pages is not enabled, this job is allowed to fail so CI stays green.
  # Enable it after merge: Settings > Pages > Source: GitHub Actions.
  deploy-report:
    name: Publish report to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Playwright report
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload Pages artifact
        id: pages-upload
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages-upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v5
